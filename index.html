<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0064f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Serayu" />
    <meta
      name="description"
      content="Serayu UI - Mobile-first React UI components built with Radix UI and Tailwind CSS. by Serayu Digital - www.serayudigital.com"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Serayu UI" />
    <meta
      property="og:title"
      content="Serayu UI - Mobile-first React UI components built with Radix UI and Tailwind CSS"
    />
    <meta
      property="og:description"
      content="Build React apps that feel native on mobile. 56 UI components + 30 mobile-first patterns, 7 theme presets, PWA-ready."
    />
    <meta property="og:url" content="https://www.serayudigital.com" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Serayu UI - React components that feel native" />
    <meta
      name="twitter:description"
      content="56 UI components + 30 mobile-first patterns. 7 theme presets, PWA-ready."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <title>Serayu UI - Mobile-first React UI components built with Radix UI and Tailwind CSS</title>
    <script>
      // Anti FOWT (flash of wrong theme) - set data-theme BEFORE React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("sd-theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : stored === "system" || !stored
              ? system
              : "light";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
